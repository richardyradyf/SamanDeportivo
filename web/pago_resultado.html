<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samán Deportivo · Pago</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
    main { max-width: 22rem; padding: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1 id="titulo">Procesando…</h1>
    <p id="texto"></p>
  </main>
  <script>
    const p = new URLSearchParams(location.search);
    const estado = p.get('estado');
    // En web, la app abre pagar.html dentro de un iframe y espera este aviso.
    if (window.parent !== window) {
      window.parent.postMessage({
        tipo: 'paypal', estado,
        orderId: p.get('orderId'), captureId: p.get('captureId'), monto: p.get('monto'),
      }, location.origin);
    }
    const textos = {
      COMPLETED: ['Pago recibido', 'Vuelve a Samán Deportivo.'],
      CANCELLED: ['Pago cancelado', 'No se cobró nada.'],
    };
    const [titulo, texto] = textos[estado] || ['No se pudo completar el pago', 'Puedes intentarlo de nuevo.'];
    document.getElementById('titulo').textContent = titulo;
    document.getElementById('texto').textContent = texto;
  </script>
</body>
</html>
