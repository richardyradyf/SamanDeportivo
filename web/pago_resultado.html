<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samán Deportivo · Pago</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
    main { max-width: 22rem; padding: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1 id="titulo">Pago recibido</h1>
    <p id="texto">Vuelve a Samán Deportivo y toca «Ya pagué».</p>
  </main>
  <script>
    if (new URLSearchParams(location.search).get('estado') === 'cancelado') {
      document.getElementById('titulo').textContent = 'Pago cancelado';
      document.getElementById('texto').textContent = 'No se cobró nada. Vuelve a Samán Deportivo para intentarlo otra vez.';
    }
  </script>
</body>
</html>
